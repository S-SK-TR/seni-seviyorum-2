    HTML Documentation

    Semantic Elements Used:
    - <meta> tags for SEO and PWA configuration
    - <link> tags for favicons, manifest, and fonts
    - <div id="root"> as the single root element for React

    1. PWA Support: manifest.json and various favicon sizes
    2. Dark Mode: class="dark" on html element
    3. Responsive Meta Tag: viewport with width=device-width

    5. Open Graph and Twitter Card meta tags for social sharing

    Accessibility Features:
    - Proper lang attribute
    - Semantic HTML structure
    - ARIA roles where applicable
  -->
